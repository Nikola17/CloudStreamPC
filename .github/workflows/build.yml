name: Build

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'README.md', 'docs/**' ]
  workflow_dispatch:
    inputs:
      test_signing:
        description: "Tester la signature avec un certificat jetable (pas de release)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Code signing (optional): see "Signature" in the README.
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path build.gradle.kts -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      # mpv is bundled so videos play without installing anything else.
      - name: Download mpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "CloudStreamPC" }
          $release = Invoke-RestMethod -Headers $headers https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest
          $asset = $release.assets | Where-Object { $_.name -match '^mpv-x86_64-\d{8}-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "Aucune archive mpv trouvée" }
          Write-Host "mpv : $($asset.name)"
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile mpv.7z
          New-Item -ItemType Directory -Force app-resources/windows/mpv | Out-Null
          7z x mpv.7z -oapp-resources/windows/mpv -y | Out-Null
          if (-not (Test-Path app-resources/windows/mpv/mpv.exe)) { throw "mpv.exe absent de l'archive" }

      # yt-dlp lets mpv read YouTube trailers. Latest release: YouTube changes often.
      - name: Download yt-dlp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app-resources/windows/yt-dlp | Out-Null
          $base = "https://github.com/yt-dlp/yt-dlp/releases/latest/download"
          Invoke-WebRequest -Uri "$base/yt-dlp.exe" -OutFile app-resources/windows/yt-dlp/yt-dlp.exe
          Invoke-WebRequest -Uri "$base/SHA2-256SUMS" -OutFile yt-dlp-sums.txt
          $expected = (Select-String -Path yt-dlp-sums.txt -Pattern ' yt-dlp\.exe$').Line.Split(' ')[0]
          $actual = (Get-FileHash app-resources/windows/yt-dlp/yt-dlp.exe -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "Somme de contrôle de yt-dlp.exe invalide" }
          app-resources/windows/yt-dlp/yt-dlp.exe --version

      # Torrent engine (GPL-3.0), pinned version.
      - name: Download TorrServer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app-resources/windows/torrserver | Out-Null
          Invoke-WebRequest -Uri "https://github.com/YouROK/TorrServer/releases/download/MatriX.146.1/TorrServer-windows-amd64.exe" -OutFile app-resources/windows/torrserver/TorrServer.exe
          if ((Get-Item app-resources/windows/torrserver/TorrServer.exe).Length -lt 10MB) { throw "TorrServer.exe incomplet" }

      # The player's IPC (named pipes) only exists on Windows: test it with the bundled mpv.
      - name: Test mpv IPC on Windows
        run: ./gradlew --no-daemon test --tests "com.cloudstreampc.MpvIpcTest" "-Dtest.mpv=app-resources/windows/mpv/mpv.exe"

      - name: Build installers
        run: ./gradlew --no-daemon packageMsi packageExe createDistributable

      - name: Collect files
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem build/compose/binaries/main/msi/*.msi | Copy-Item -Destination "dist/CloudStreamPC-$v.msi"
          Get-ChildItem build/compose/binaries/main/exe/*.exe | Copy-Item -Destination "dist/CloudStreamPC-$v-setup.exe"

      - name: Sign
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist/*.msi, dist/*.exe) + @(Get-Item build/compose/binaries/main/app/CloudStreamPC/CloudStreamPC.exe)
          $test = "${{ inputs.test_signing }}" -eq "true"
          ./scripts/sign.ps1 -Files ($files | ForEach-Object FullName) -TestCertificate:$test

      - name: Portable zip and checksums
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path build/compose/binaries/main/app/CloudStreamPC -DestinationPath "dist/CloudStreamPC-$v-portable.zip"
          Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CloudStreamPC-windows
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)" >> "$GITHUB_OUTPUT"

      # mpv comes from the system (apt install mpv); yt-dlp and TorrServer are bundled as on Windows.
      - name: Download yt-dlp and TorrServer
        run: |
          mkdir -p app-resources/linux/yt-dlp app-resources/linux/torrserver
          base=https://github.com/yt-dlp/yt-dlp/releases/latest/download
          curl -fsSL "$base/yt-dlp_linux" -o app-resources/linux/yt-dlp/yt-dlp
          curl -fsSL "$base/SHA2-256SUMS" -o yt-dlp-sums.txt
          expected=$(awk '$2 == "yt-dlp_linux" {print $1}' yt-dlp-sums.txt)
          echo "$expected  app-resources/linux/yt-dlp/yt-dlp" | sha256sum -c -
          curl -fsSL https://github.com/YouROK/TorrServer/releases/download/MatriX.146.1/TorrServer-linux-amd64 -o app-resources/linux/torrserver/TorrServer
          test $(stat -c %s app-resources/linux/torrserver/TorrServer) -gt 10000000
          chmod +x app-resources/linux/yt-dlp/yt-dlp app-resources/linux/torrserver/TorrServer
          app-resources/linux/yt-dlp/yt-dlp --version

      - name: Packaging tools
        run: sudo apt-get update -q && sudo apt-get install -y -q fakeroot rpm

      - name: Tests and packages
        run: ./gradlew --no-daemon test packageDeb packageRpm createDistributable

      - name: Collect files
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp build/compose/binaries/main/deb/*.deb "dist/CloudStreamPC-$v-amd64.deb"
          cp build/compose/binaries/main/rpm/*.rpm "dist/CloudStreamPC-$v-x86_64.rpm"
          tar -C build/compose/binaries/main/app -czf "dist/CloudStreamPC-$v-linux-x64.tar.gz" CloudStreamPC
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: CloudStreamPC-linux
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Download yt-dlp and TorrServer
        run: |
          mkdir -p app-resources/macos/yt-dlp app-resources/macos/torrserver
          base=https://github.com/yt-dlp/yt-dlp/releases/latest/download
          curl -fsSL "$base/yt-dlp_macos" -o app-resources/macos/yt-dlp/yt-dlp
          curl -fsSL "$base/SHA2-256SUMS" -o yt-dlp-sums.txt
          expected=$(awk '$2 == "yt-dlp_macos" {print $1}' yt-dlp-sums.txt)
          echo "$expected  app-resources/macos/yt-dlp/yt-dlp" | shasum -a 256 -c -
          curl -fsSL https://github.com/YouROK/TorrServer/releases/download/MatriX.146.1/TorrServer-darwin-arm64 -o app-resources/macos/torrserver/TorrServer
          test $(stat -f %z app-resources/macos/torrserver/TorrServer) -gt 10000000
          chmod +x app-resources/macos/yt-dlp/yt-dlp app-resources/macos/torrserver/TorrServer

      - name: Icon
        run: |
          mkdir icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size icons/icon.png --out icon.iconset/icon_${size}x${size}.png > /dev/null
            sips -z $((size * 2)) $((size * 2)) icons/icon.png --out icon.iconset/icon_${size}x${size}@2x.png > /dev/null
          done
          iconutil -c icns icon.iconset -o icons/icon.icns

      - name: Package
        run: ./gradlew --no-daemon packageDmg

      - name: Collect files
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp build/compose/binaries/main/dmg/*.dmg "dist/CloudStreamPC-$v-macos-arm64.dmg"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: CloudStreamPC-macos
          path: dist/*

  release:
    needs: [ windows, linux, macos ]
    if: github.ref == 'refs/heads/main' && inputs.test_signing != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One list of SHA-256 for every file: the app checks its update against it before installing.
      - name: Checksums
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: CloudStreamPC ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
          body: |
            **Windows :** téléchargez `CloudStreamPC-${{ steps.version.outputs.version }}-setup.exe` et lancez-le.
            Version sans installation : `CloudStreamPC-${{ steps.version.outputs.version }}-portable.zip` (décompressez puis lancez `CloudStreamPC.exe`).
            Si Windows affiche « Windows a protégé votre ordinateur » : « Informations complémentaires » puis « Exécuter quand même ».

            **Linux :** `.deb` (Ubuntu, Debian, Mint…), `.rpm` (Fedora, openSUSE…) ou `linux-x64.tar.gz`. Installez aussi mpv (`sudo apt install mpv`).

            **macOS (Apple Silicon) :** ouvrez le `.dmg` et glissez CloudStreamPC dans Applications. Installez mpv (`brew install mpv`).
            L'application n'étant pas notariée, au premier lancement : clic droit sur l'application → Ouvrir.

            Les versions suivantes s'installent depuis l'application (Paramètres → Mises à jour et Sauvegarde).
            Les empreintes SHA-256 des fichiers sont dans `SHA256SUMS.txt`.
