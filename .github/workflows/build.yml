name: Build

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'README.md', 'docs/**' ]
  workflow_dispatch:
    inputs:
      test_signing:
        description: "Tester la signature avec un certificat jetable (pas de release)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Code signing (optional): see "Signature" in the README.
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path build.gradle.kts -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      # mpv is bundled so videos play without installing anything else.
      - name: Download mpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "CloudStreamPC" }
          $release = Invoke-RestMethod -Headers $headers https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest
          $asset = $release.assets | Where-Object { $_.name -match '^mpv-x86_64-\d{8}-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "Aucune archive mpv trouvée" }
          Write-Host "mpv : $($asset.name)"
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile mpv.7z
          New-Item -ItemType Directory -Force app-resources/windows/mpv | Out-Null
          7z x mpv.7z -oapp-resources/windows/mpv -y | Out-Null
          if (-not (Test-Path app-resources/windows/mpv/mpv.exe)) { throw "mpv.exe absent de l'archive" }
          # Only the player itself: no documentation, installer scripts or console wrapper.
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue app-resources/windows/mpv/doc, app-resources/windows/mpv/installer, app-resources/windows/mpv/mpv.com
          Get-ChildItem app-resources/windows/mpv | Format-Table Name, Length

      # The player's IPC (named pipes) only exists on Windows: test it with the bundled mpv.
      - name: Test mpv IPC on Windows
        run: ./gradlew --no-daemon test --tests "com.cloudstreampc.MpvIpcTest" "-Dtest.mpv=app-resources/windows/mpv/mpv.exe"

      # Release build (unused parts of Compose removed), then jars stored for the installer's LZMA.
      - name: Build the app
        run: |
          ./gradlew --no-daemon createReleaseDistributable
          python scripts/slim_app.py build/compose/binaries/main-release/app/CloudStreamPC windows

      - name: Sign the program
        shell: pwsh
        run: |
          $test = "${{ inputs.test_signing }}" -eq "true"
          ./scripts/sign.ps1 -Files (Get-Item build/compose/binaries/main-release/app/CloudStreamPC/CloudStreamPC.exe).FullName -TestCertificate:$test

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          $src = (Resolve-Path build/compose/binaries/main-release/app/CloudStreamPC).Path
          $out = (Resolve-Path dist).Path
          & $iscc /Q "/DAppVersion=$v" "/DSourceDir=$src" "/DOutputDir=$out" scripts/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup a échoué" }

      - name: Sign the installer
        shell: pwsh
        run: |
          $test = "${{ inputs.test_signing }}" -eq "true"
          ./scripts/sign.ps1 -Files ((Get-ChildItem dist/*.exe) | ForEach-Object FullName) -TestCertificate:$test

      - name: Portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Compress-Archive -CompressionLevel Optimal -Path build/compose/binaries/main-release/app/CloudStreamPC -DestinationPath "dist/CloudStreamPC-$v-portable.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: CloudStreamPC-windows
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Packaging tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fakeroot rpm
          # xz for the .rpm too (rpmbuild's default compresses less).
          echo '%_binary_payload w9.xzdio' >> ~/.rpmmacros

      - name: Tests and app
        run: |
          # The extensions' WebView is tested with the runner's Chrome.
          ./gradlew --no-daemon test createReleaseDistributable "-Dtest.browser=$(command -v google-chrome || echo none)"
          python3 scripts/slim_app.py build/compose/binaries/main-release/app/CloudStreamPC linux

      # mpv comes from the system (apt install mpv); the torrent engine and yt-dlp download on first use.
      - name: Packages
        run: |
          v="${{ steps.version.outputs.version }}"
          app=build/compose/binaries/main-release/app/CloudStreamPC
          mkdir -p out dist
          for type in deb rpm; do
            jpackage --type $type --app-image $app --name CloudStreamPC --app-version $v --dest out \
              --vendor CloudStreamPC --description "CloudStream pour ordinateur" --icon icons/icon.png \
              --linux-package-name cloudstreampc --linux-deb-maintainer cloudstreampc@users.noreply.github.com \
              --linux-menu-group AudioVideo --linux-app-category AudioVideo --linux-shortcut
          done
          cp out/*.deb "dist/CloudStreamPC-$v-amd64.deb"
          cp out/*.rpm "dist/CloudStreamPC-$v-x86_64.rpm"
          XZ_OPT="-9 -T0" tar -C "$(dirname $app)" -cJf "dist/CloudStreamPC-$v-linux-x64.tar.xz" CloudStreamPC
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: CloudStreamPC-linux
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Icon
        run: |
          mkdir icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size icons/icon.png --out icon.iconset/icon_${size}x${size}.png > /dev/null
            sips -z $((size * 2)) $((size * 2)) icons/icon.png --out icon.iconset/icon_${size}x${size}@2x.png > /dev/null
          done
          iconutil -c icns icon.iconset -o icons/icon.icns

      - name: App
        run: |
          ./gradlew --no-daemon createReleaseDistributable
          app=build/compose/binaries/main-release/app/CloudStreamPC.app
          python3 scripts/slim_app.py $app macos
          # Files changed after jpackage's signature: sign the bundle again (ad hoc, no Apple account).
          codesign --force --deep --sign - $app

      - name: Package
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p out dist
          jpackage --type dmg --app-image build/compose/binaries/main-release/app/CloudStreamPC.app --name CloudStreamPC \
            --app-version $v --dest out --vendor CloudStreamPC
          # LZMA-compressed image (macOS 10.15+), smaller than jpackage's zlib one.
          hdiutil convert out/*.dmg -format ULMO -o "dist/CloudStreamPC-$v-macos-arm64.dmg"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: CloudStreamPC-macos
          path: dist/*

  release:
    needs: [ windows, linux, macos ]
    if: github.ref == 'refs/heads/main' && inputs.test_signing != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Download size watch: each file against the same file of the previous release.
      - name: Sizes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/size_check.py dist "${{ steps.version.outputs.version }}" "${{ github.repository }}"

      # One list of SHA-256 for every file: the app checks its update against it before installing.
      - name: Checksums
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: CloudStreamPC ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
          body: |
            **Windows :** téléchargez `CloudStreamPC-${{ steps.version.outputs.version }}-setup.exe` et lancez-le.
            Version sans installation : `CloudStreamPC-${{ steps.version.outputs.version }}-portable.zip` (décompressez puis lancez `CloudStreamPC.exe`).
            Si Windows affiche « Windows a protégé votre ordinateur » : « Informations complémentaires » puis « Exécuter quand même ».

            **Linux :** `.deb` (Ubuntu, Debian, Mint…), `.rpm` (Fedora, openSUSE…) ou `linux-x64.tar.xz`. Installez aussi mpv (`sudo apt install mpv`).

            **macOS (Apple Silicon) :** ouvrez le `.dmg` et glissez CloudStreamPC dans Applications. Installez mpv (`brew install mpv`).
            L'application n'étant pas notariée, au premier lancement : clic droit sur l'application → Ouvrir.

            Les versions suivantes s'installent depuis l'application (Paramètres → Mises à jour et Sauvegarde).
            Le moteur torrent et le lecteur de bandes-annonces se téléchargent la première fois qu'on s'en sert.
            Les empreintes SHA-256 des fichiers sont dans `SHA256SUMS.txt`.
